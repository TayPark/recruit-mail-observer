[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recruit-mail-observer"
version = "0.1.0"
description = "Observe unread recruitment emails via IMAP, classify outcomes, notify Slack, and sync Notion."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
recruit-mail-observer = "recruit_mail_observer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recruit_mail_observer = ["defaults/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
